[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacoma"
version = "0.1.0"
description = "TACOMA — Theme Aware Comprehensive Omarchy Mixer Application"
requires-python = ">=3.11"
# PyGObject/GTK4 are system packages (python-gobject, gtk4); not pip dependencies.
dependencies = []

[project.scripts]
tacoma = "tacoma.app:main"

[tool.setuptools]
packages = ["tacoma"]
